services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d FieldOpsDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      Postgres__ConnectionString: "Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Auth__issuerSigningKey: ${JWT_SIGNING_KEY}
      Auth__issuer: ${AUTH_ISSUER}
      Auth__validIssuer: ${AUTH_VALID_ISSUER}
      S3__ServiceUrl: ${S3_SERVICE_URL}
      S3__AccessKeyId: ${S3_ACCESS_KEY}
      S3__SecretAccessKey: ${S3_SECRET_KEY}
      S3__BucketName: ${S3_BUCKET_NAME}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
